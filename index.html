<style>

*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
p,li{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.75;color:#d5dae2}
a{color:var(--ac)}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.88);backdrop-filter:blur(10px);padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,#ffd666,#e0a526);-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1;min-width:170px;padding:10px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:15px system-ui,sans-serif}
input:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd)}
nav button{background:transparent;border:1px solid transparent;color:var(--mu);padding:7px 14px;cursor:pointer;font:500 14px system-ui,sans-serif;border-radius:999px;transition:.15s}
nav button:hover{color:var(--tx);background:var(--sf)}
nav button.on{background:var(--g);color:#111;font-weight:600}
nav button:focus-visible,.card:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--g);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
h2,h3{color:#fff;letter-spacing:-.01em}h2{margin:.6em 0 .4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ban{height:104px;display:flex;align-items:center;justify-content:center;font-size:50px;background-size:cover!important}
.big{height:240px;font-size:96px;border-radius:16px}
.card .t{padding:10px 12px;font:14px system-ui,sans-serif;color:var(--mu)}.card .t b{color:var(--tx);font-size:15px}
.fact{background:linear-gradient(135deg,#1b2a4a,#142036);color:#e6ecf8;padding:14px 18px;border-left:4px solid var(--g);border-radius:10px;margin:14px 0}
.row{display:flex;gap:20px;flex-wrap:wrap}.row>*{flex:1 1 260px}
.toc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;font:14px system-ui,sans-serif;flex:0 0 210px;align-self:flex-start}
.toc a,.lk{color:var(--ac);cursor:pointer;display:block;text-decoration:none}.toc a:hover,.lk:hover{text-decoration:underline}
.btn,.opt{font:500 14px system-ui,sans-serif;padding:9px 16px;margin:4px 6px 4px 0;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;cursor:pointer;transition:.15s}
.opt{display:block;width:100%;text-align:left;padding:12px 16px}
.btn:hover,.opt:hover:not(:disabled){background:var(--sf2);border-color:var(--g)}
input,textarea{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
svg{width:100%;background:#0a1626;border:1px solid var(--bd);border-radius:14px}
svg path{fill:#2b3441;stroke:#0a1626;stroke-width:.15;cursor:pointer}svg path:hover{fill:#e0a526}svg path.sel{fill:#4f8cff}
svg polygon{fill:#2b3441}svg circle{fill:#c0392b}
.ev{display:flex;gap:14px;border-left:2px solid var(--g);padding:6px 0 6px 14px;margin-left:8px}.ev b{min-width:90px;color:var(--g)}
small{color:var(--mu)}

maze(m){if(!m){V.innerHTML=`<h2>Mind Maze</h2><p>Choose a quiz. Each round has up to 10 questions drawn from the whole encyclopedia.</p>`+[["mixed","Mixed: topics and years"],["topic","Which topic is this fact about?"],["year","In which year did this happen?"],["classic","Classic questions"]].map(x=>`<button class="opt" data-m="${x[0]}">${x[1]}</button>`).join("")+`<p>Topic quiz by category:</p>`+Object.keys(CAT).map(c=>`<button class="btn" data-m="cat:${c}">${c}</button>`).join("");V.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>R.maze(b.dataset.m));return}
const sh=a=>[...a].sort(()=>Math.random()-.5);
const topicQ=cat=>Object.keys(FUN).filter(i=>get(i)&&(!cat||get(i).c==cat)).map(i=>{const t=get(i).t,f=FUN[i],w=t.toLowerCase().split(/\W+/).filter(x=>x.length>3);if(w.some(x=>f.toLowerCase().includes(x)))return null;return[`Which topic is this about? “${f}”`,sh([t,...sh(A.filter(a=>a.id!=i&&(!cat||a.c==cat)).map(a=>a.t)).slice(0,3)]),t]}).filter(Boolean);
const yearQ=()=>TODAY.filter(e=>e[2]>0&&!e[3].includes(String(e[2]))).map(e=>{const y=e[2],o=new Set([y]);while(o.size<4)o.add(Math.max(1,y+Math.round((Math.random()-.5)*Math.max(20,Math.min(80,y/10)))));return[`In which year did this happen? “${e[3]}”`,sh([...o]).map(String),String(y)]});
let Qs;if(m=="classic")Qs=Q.map(q=>[q[0],q[1],q[1][q[2]]]);else if(m=="topic")Qs=topicQ();else if(m=="year")Qs=yearQ();else if(m.startsWith("cat:"))Qs=topicQ(m.slice(4));else Qs=[...sh(topicQ()).slice(0,5),...sh(yearQ()).slice(0,5)];
const L=sh(Qs).slice(0,10);if(!L.length){V.innerHTML="<p>No questions available for this quiz yet.</p><button class=\"btn\" onclick=\"go('maze')\">Back</button>";return}
let i=0,s=0;const n=()=>{if(i>=L.length){V.innerHTML=`<h2>Score: ${s} of ${L.length}</h2><button class="btn" id="pa">Play again</button><button class="btn" id="mn">Menu</button>`;$("#pa").onclick=()=>R.maze(m);$("#mn").onclick=()=>R.maze();return}
const q=L[i];V.innerHTML=`<h2>Mind Maze, question ${i+1} of ${L.length}</h2><p>${q[0]}</p>`+q[1].map(o=>`<button class="opt">${o}</button>`).join("");
V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.textContent==q[2];if(ok)s++;V.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==q[2])x.style.background="#1f6f43"});if(!ok)b.style.background="#8a2c2c";setTimeout(()=>{i++;n()},1200)})};n()},
dict(){V.innerHTML=`<h2>Dictionary</h2><input id="dq" placeholder="Search a word or prefix" aria-label="Search words" style="padding:8px;width:100%;font:15px sans-serif"><div id="al"></div><div id="dl">Loading dictionary…</div><div id="pg"></div><p><small>General definitions from WordNet 3.1, © Princeton University.</small></p>`;
$("#al").innerHTML="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l=>`<button class="btn" data-l="${l}" style="padding:4px 9px">${l}</button>`).join("");
let q="",off=0;const PS={n:"noun",v:"verb",a:"adj.",r:"adv."};
const show=()=>{const D=window.DICTW||[],k=q.toLowerCase(),enc=k?DICT.filter(d=>d.toLowerCase().startsWith(k)):DICT,m=k?D.filter(x=>x.startsWith(k)):D;
$("#dl").innerHTML=(off?"":enc.map(d=>{const[w,x]=d.split("|");return `<p><b>${w}</b> <i>encyclopedia term</i>. ${x}</p>`}).join(""))+m.slice(off,off+50).map(x=>{const[w,p,...d]=x.split("|");return `<p><b>${w}</b> <i>${PS[p]}</i>. ${d.join("|")}</p>`}).join("")||"<p>No matching words.</p>";
$("#pg").innerHTML=`<p>${m.length.toLocaleString()} general entries</p>`+(off?`<button class="btn" id="pv">Previous</button>`:"")+(off+50<m.length?`<button class="btn" id="nx">Next</button>`:"");
if($("#pv"))$("#pv").onclick=()=>{off-=50;show();scrollTo(0,0)};if($("#nx"))$("#nx").onclick=()=>{off+=50;show();scrollTo(0,0)}};
$("#dq").oninput=e=>{q=e.target.value.trim();off=0;show()};
V.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{q=b.dataset.l;$("#dq").value=q;off=0;show()});
if(window.DICTW)show();else{const sc=document.createElement("script");sc.src="data/dictionary.js";sc.onload=show;sc.onerror=()=>{$("#dl").textContent="Dictionary file not found. Upload data/dictionary.js."};document.head.appendChild(sc)}},
chal(){const L=WORLD.map(w=>[w[0],(PROF[w[0]]||[])[0]]).filter(x=>x[1]),sh=a=>[...a].sort(()=>Math.random()-.5);let i=0,s=0;const Qs=sh(L).slice(0,10);const n=()=>{if(i>=10){V.innerHTML=`<h2>Score: ${s} of 10</h2><button class="btn" onclick="go('chal')">Play again</button>`;return}const q=Qs[i],o=sh([q[1],...sh(L.filter(x=>x[1]!=q[1])).slice(0,3).map(x=>x[1])]);V.innerHTML=`<h2>Capitals Challenge ${i+1} of 10</h2><p>What is the capital of ${q[0]}?</p>`+o.map(x=>`<button class="opt">${x}</button>`).join("");V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.textContent==q[1];if(ok)s++;V.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==q[1])x.style.background="#1f6f43"});if(!ok)b.style.background="#8a2c2c";setTimeout(()=>{i++;n()},1100)})};n()},
notes(){V.innerHTML=`<h2>Research notes</h2><textarea id="nt" rows="14" style="width:100%;font:15px sans-serif;padding:8px" aria-label="Notes"></textarea><br><button class="btn" id="dl">Download notes</button><button class="btn" id="cl">Clear</button>`;const t=$("#nt");t.value=ls("nt","");t.oninput=()=>sv("nt",t.value);$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t.value],{type:"text/plain"}));a.download="notes.txt";a.click()};$("#cl").onclick=()=>{if(confirm("Clear all notes?")){t.value="";sv("nt","")}}},
saved(){const l=id=>id.map(get);V.innerHTML=`<h2>Bookmarks</h2>${bm.length?cards(l(bm)):"<p>Open an article and select Bookmark to save it here.</p>"}<h2>Recently viewed</h2>${hi.length?cards(l(hi)):"<p>Nothing viewed yet.</p>"}`},
search(q){q=q.toLowerCase();const r=A.filter(a=>(a.t+a.p.map(x=>x.join(" ")).join(" ")).toLowerCase().includes(q)),d=DICT.filter(x=>x.toLowerCase().includes(q));V.innerHTML=`<h2>Results for “${q.replace(/</g,"&lt;")}”</h2>${r.length?cards(r):"<p>No articles found.</p>"}${d.length?"<h3>Dictionary</h3>"+d.map(x=>{const[w,y]=x.split("|");return `<p><b>${w}</b>. ${y}</p>`}).join(""):""}`}};
const TABS=[["home","Home"],["browse","Articles"],["atlas","Atlas"],["time","Timeline"],["maze","Mind Maze"],["dict","Dictionary"],["chal","Capitals"],["notes","Notes"],["saved","My Library"]];
